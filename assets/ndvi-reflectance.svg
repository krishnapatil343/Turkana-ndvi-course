<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
<title id="title">Red and near-infrared reflectance</title><desc id="desc">Illustrative green vegetation pixel: red reflectance 0.10 and near-infrared reflectance 0.50.</desc>
<rect width="760" height="260" rx="16" fill="#f1f6f2"/>
<g font-family="system-ui, sans-serif" fill="#173a2c">
<text x="32" y="45" font-size="24" font-weight="bold">Example reflectance from a green vegetation pixel</text>
<text x="32" y="109" font-size="18">Red</text><text x="32" y="170" font-size="18">Near infrared</text>
<rect x="180" y="86" width="80" height="28" rx="4" fill="#ab3f39"/>
<rect x="180" y="147" width="400" height="28" rx="4" fill="#276848"/>
<text x="274" y="108" font-size="18">0.10</text><text x="594" y="169" font-size="18">0.50</text>
<text x="32" y="224" font-size="17">Illustrative values. Both bars use the same scale.</text>
</g></svg>